<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWOTTER - Buy & Sell</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            /* Reduced font size by 1 unit */
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .drawer {
            height: 100%;
            width: 250px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: -250px;
            background-color: #111;
            overflow-x: hidden;
            padding-top: 60px;
            transition: 0.5s;
        }

        .drawer a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 18px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .drawer a:hover {
            color: #f1f1f1;
        }

        .drawer .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        header {
            background-color: rgb(148, 208, 240);
            color: black;
            padding: 1em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header .menu-icon {
            font-size: 1.5em;
            cursor: pointer;
            margin-right: 10px;
            color: black;
        }

        header h1 {
            margin: 0;
            font-size: 1.8em;
        }

        header .icons a {
            color: black;
            text-decoration: none;
            margin-left: 15px;
            display: flex;
            align-items: center;
        }

        header .icons img {
            width: 28px;
            height: 28px;
            margin-right: 5px;
        }

        header .icons .count {
            background-color: black;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7em;
            vertical-align: middle;
        }

        .search-container {
            padding: 1em;
            background-color: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .search-container i {
            color: #777;
        }

        .search-container input[type="text"] {
            padding: 0.8em;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex-grow: 1;
            font-size: 1em;
            color: gray;
        }

        .search-container button {
            padding: 0.8em 1.5em;
            background-color: rgb(70, 182, 242);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .search-container button:hover {
            background-color: rgb(12, 87, 127);
        }

        #hero {
            background-color: #e9ecef;
            padding: 3em 2em;
            text-align: center;
        }

        #hero h2 {
            font-size: 2em;
            margin-bottom: 1em;
            color: #333;
        }

        #hero .btn {
            display: inline-block;
            padding: 1em 2em;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }

        #hero .btn:hover {
            background-color: #033a70;
        }

        footer {
            text-align: center;
            padding: 1em;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .books-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
            margin: 2em;
            justify-content: center;

        }

        .book-card {
            width: 250px;
            /* Slightly wider to accommodate buttons */
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s ease;
            margin-bottom: 2em;
            /* Added margin to separate cards */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Distribute space for content and buttons */
        }

        .book-card:hover {
            transform: scale(1.03);
        }

        .book-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .book-card .book-details {
            padding: 1em;
        }

        .book-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 0.5em;
        }

        .book-price {
            color: #28a745;
            font-size: 1em;
            margin-bottom: 0.5em;
            /* Added margin for spacing */
        }

        .book-card .actions {
            display: flex;
            justify-content: space-around;
            padding: 0.5em;
            border-top: 1px solid #eee;
        }

        .book-card .actions button {
            padding: 0.7em 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        .book-card .buy-btn {
            background-color: transparent;
            color: black;
        }

        .book-card .buy-btn:hover {
            background-color: #007bff;
        }

        .book-card .add-cart-btn {
            background-color: transparent;
            color: black;
        }

        .book-card .add-cart-btn:hover {
            background-color: #28a745;
        }

        .book-card .wishlist-btn {
            background-color: transparent;
            /* Make the background transparent */
            color: inherit;
            /* Inherit the text color from the parent if needed */
            border: none;
            /* Optionally remove the border as well */
            padding: 0;
            /* Adjust padding if needed */
        }

        .book-card .wishlist-btn:hover {
            background-color: transparent;
        }
    </style>
</head>

<body>
    <div id="drawer" class="drawer">
        <a href="javascript:void(0)" class="closebtn" onclick="closeDrawer()">&times;</a>
        <a href="index.html">Home</a>
        <a href="account.html">My Account</a>
        <a href="categories.html">Categories</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Help</a>
    </div>

    <header>
        <span class="menu-icon" onclick="openDrawer()">&#9776;</span>
        <h1>SWOTTER</h1>
        <div class="icons">
            <a href="wishlist.html">
                <img src="wishlist.png" alt="Wishlist Icon" style="width: 28px; height: 28px;">
                <span class="count" id="wishlist-count">0</span>
            </a>
            <a href="cart.html">
                <img src="cart.png" alt="Cart Icon" style="width: 28px; height: 28px;">
                <span class="count" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="searchBar" placeholder="Search for books..." onkeyup="searchBooks()">
        <button onclick="searchBooks()">Search</button>
    </div>

    <section id="hero">
        <h2>Buy & Sell Books, Anytime Anywhere!</h2>
        <a href="post.html" class="btn">Sell</a>
    </section>

    <h2 style="text-align:center; margin-top: 2em;">Available Books</h2>
    <div id="booksContainer" class="books-container"></div>


    <footer>
        <p>&copy; 2025 SWOTTER. All Rights Reserved.</p>
    </footer>

    <script>
        function openDrawer() {
            document.getElementById("drawer").style.left = "0";
        }
        function closeDrawer() {
            document.getElementById("drawer").style.left = "-250px";
        }

        function searchBooks() {
            let input, filter, bookCards, bookCard, title, i, txtValue;
            input = document.getElementById("searchBar");
            filter = input.value.toUpperCase();
            bookCards = document.getElementById("booksContainer").getElementsByClassName("book-card");

            for (i = 0; i < bookCards.length; i++) {
                titleElement = bookCards[i].querySelector(".book-title");
                if (titleElement) {
                    txtValue = titleElement.textContent.toUpperCase();
                    if (txtValue.indexOf(filter) > -1) {
                        bookCards[i].style.display = "";
                    } else {
                        bookCards[i].style.display = "none";
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            updateCartCount();

            function updateCartCount() {
                const cartCountElement = document.getElementById('cart-count');
                if (cartCountElement) {
                    cartCountElement.textContent = cart.length;
                }
            }

            function addToCart(title, price, img) {
                cart.push({ title, price, img });
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();
            }

            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            updateWishlistCount();

            function updateWishlistCount() {
                const wishlistCountElement = document.getElementById('wishlist-count');
                if (wishlistCountElement) {
                    wishlistCountElement.textContent = wishlist.length;
                }
            }

            function addToWishlist(title, price, img) {
                wishlist.push({ title: title, price: price, img: img });
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                updateWishlistCount();
            }

            // Fetch books from server and display them
            // Fetch books from server and display them
            function loadBooks() {
                fetch('http://localhost:5000/api/books')
                    .then(response => response.json())
                    .then(data => {
                        const container = document.getElementById('booksContainer');
                        container.innerHTML = '';

                        data.forEach(book => {
                            const card = document.createElement('div');
                            card.className = 'book-card';
                            const isWishlisted = wishlist.some(item => item.title === book.title);
                            const initialWishlistIcon = isWishlisted ? 'heart.png' : 'wishlist.png';

                            const image = book.image
                                ? `<img src="${book.image}" alt="${book.title}">`
                                : `<img src="https://via.placeholder.com/250x200.png?text=No+Image" alt="No Image">`;

                            card.innerHTML = `
                            ${image}
                            <div class="book-details">
                                <div class="book-title">${book.title}</div>
                                <div class="book-price">₹${book.price}</div>
                            </div>
                            <div class="actions">
                                <button class="buy-btn" onclick="window.location.href='checkout.html?title=${encodeURIComponent(book.title)}&price=${book.price}&img=${encodeURIComponent(book.image || 'https://via.placeholder.com/150x100.png?text=No+Image')}'">Buy</button>
                                <button class="add-cart-btn" data-title="${book.title}" data-price="${book.price}" data-img="${book.image || 'https://via.placeholder.com/100x100.png?text=No+Image'}">Add to Cart</button>
                                <button class="wishlist-btn" data-title="${book.title}" data-price="${book.price}" data-img="${book.image || 'https://via.placeholder.com/100x100.png?text=No+Image'}">
                                    <img src="${initialWishlistIcon}" alt="Wishlist Icon" style="width: 24px; height: 24px; vertical-align: middle;">
                                </button>
                            </div>
                        `;

                            container.appendChild(card);
                        });

                        // Attach event listeners to the "Add to Cart" buttons after they are loaded
                        document.querySelectorAll('.add-cart-btn').forEach(button => {
                            button.addEventListener('click', function () {
                                const title = this.getAttribute('data-title');
                                const price = parseFloat(this.getAttribute('data-price'));
                                const img = this.getAttribute('data-img');
                                addToCart(title, price, img);
                            });
                        });

                        // Attach event listeners to the "Wishlist" buttons after they are loaded
                        document.querySelectorAll('.wishlist-btn').forEach(button => {
                            const imgElement = button.querySelector('img');
                            const initialSrc = imgElement.src;
                            const hoverSrc = 'wishlist_hover.png';
                            const likedSrc = 'heart.png';
                            const title = button.getAttribute('data-title');
                            const price = parseFloat(button.getAttribute('data-price'));
                            const img = button.getAttribute('data-img');
                            let isCurrentlyWishlisted = wishlist.some(item => item.title === title);

                            button.addEventListener('mouseover', function () {
                                if (!isCurrentlyWishlisted) {
                                    imgElement.src = hoverSrc;
                                }
                            });

                            button.addEventListener('mouseout', function () {
                                if (!isCurrentlyWishlisted) {
                                    imgElement.src = initialSrc;
                                }
                            });

                            button.addEventListener('click', function () {
                                if (isCurrentlyWishlisted) {
                                    // Remove from wishlist
                                    const indexToRemove = wishlist.findIndex(item => item.title === title);
                                    if (indexToRemove > -1) {
                                        wishlist.splice(indexToRemove, 1);
                                        localStorage.setItem('wishlist', JSON.stringify(wishlist));
                                        updateWishlistCount();
                                        imgElement.src = 'wishlist.png';
                                        isCurrentlyWishlisted = false;
                                    }
                                } else {
                                    // Add to wishlist
                                    addToWishlist(title, price, img);
                                    imgElement.src = likedSrc;
                                    isCurrentlyWishlisted = true;
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.error('Failed to load books:', error);
                    });
            }
            // Load books when the page loads
            loadBooks();
        });

        function deleteBook(bookId) {
            if (confirm("Are you sure you want to delete this book?")) {
                fetch(`/api/books/${bookId}`, {
                    method: 'DELETE'
                })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message || "Book deleted");
                        location.reload(); // Refresh the page
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Failed to delete book.");
                    });
            }
        }
    </script>
</body>

</html>
