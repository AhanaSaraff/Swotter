<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - SWOTTER</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        #wishlist {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
            padding: 20px;
            justify-content: center;
        }

        .wishlist-item {
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s ease;
            margin-bottom: 2em;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .wishlist-item:hover {
            transform: scale(1.03);
        }

        .wishlist-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .wishlist-item .book-details {
            padding: 1em;
        }

        .wishlist-item .book-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 0.5em;
        }

        .wishlist-item .book-price {
            color: #28a745;
            font-size: 1em;
            margin-bottom: 0.5em;
        }

        .wishlist-item .actions {
            display: flex;
            justify-content: center;
            padding: 0.5em;
            border-top: 1px solid #eee;
        }

        .wishlist-item .remove-btn {
            padding: 0.7em 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            background-color: #dc3545;
            color: white;
            transition: background-color 0.3s ease;
        }

        .wishlist-item .remove-btn:hover {
            background-color: #c82333;
        }

        .empty-wishlist {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Your Wishlist</h1>
        <a href="index.html" class="btn">Back to Home</a>
    </header>

    <section id="wishlist">
        <p class="empty-wishlist">Your wishlist is currently empty.</p>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
            let wishlistSection = document.getElementById("wishlist");

            function displayWishlist() {
                wishlistSection.innerHTML = '';
                if (wishlist.length === 0) {
                    wishlistSection.innerHTML = "<p class='empty-wishlist'>Your wishlist is currently empty.</p>";
                } else {
                    wishlist.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'wishlist-item';
                        card.innerHTML = `
                            ${item.img ? `<img src="${item.img}" alt="${item.title}">` : '<img src="https://via.placeholder.com/250x200.png?text=No+Image" alt="No Image">'}
                            <div class="book-details">
                                <div class="book-title">${item.title}</div>
                                <div class="book-price">₹${item.price}</div>
                            </div>
                            <div class="actions">
                                <button class="remove-btn" data-index="${index}">Remove</button>
                            </div>
                        `;
                        wishlistSection.appendChild(card);
                    });

                    // Add event listeners to the "Remove" buttons
                    document.querySelectorAll('.remove-btn').forEach(button => {
                        button.addEventListener('click', function () {
                            const indexToRemove = parseInt(this.getAttribute('data-index'));
                            removeFromWishlist(indexToRemove);
                        });
                    });
                }
            }

            function removeFromWishlist(index) {
                wishlist.splice(index, 1);
                localStorage.setItem("wishlist", JSON.stringify(wishlist));
                displayWishlist(); // Re-render the wishlist
                updateWishlistCountHeader(); // Update the count on the header of index.html
            }

            function updateWishlistCountHeader() {
                const countElements = document.querySelectorAll('#wishlist-count');
                countElements.forEach(el => {
                    el.textContent = wishlist.length;
                });
            }

            displayWishlist(); // Initial display of the wishlist
        });
    </script>
</body>

</html>
