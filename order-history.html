<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - SWOTTER</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 2em auto;
            padding: 2em;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #205781;
            text-align: center;
            margin-bottom: 1.5em;
        }

        .order-list {
            list-style: none;
            padding: 0;
        }

        .order-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 1em;
            padding: 1.5em;
        }

        .order-item h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 0.5em;
        }

        .order-details {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1em 2em;
            margin-bottom: 1em;
        }

        .order-details label {
            font-weight: bold;
            color: #555;
        }

        .order-details span {
            color: #777;
        }

        .order-items-list {
            list-style: none;
            padding: 0;
            margin-top: 1em;
        }

        .order-items-list li {
            padding: 0.5em 0;
            border-bottom: 1px dotted #ccc;
        }

        .order-items-list li:last-child {
            border-bottom: none;
        }

        .order-total {
            text-align: right;
            margin-top: 1em;
            font-weight: bold;
            color: #333;
        }

        .no-orders {
            text-align: center;
            color: #777;
            padding: 2em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Order History</h1>

        <ul class="order-list">
            <li class="order-item">
                <h3>Order #12345</h3>
                <div class="order-details">
                    <label>Order Date:</label>
                    <span>April 10, 2025</span>
                    <label>Status:</label>
                    <span>Shipped</span>
                    <label>Total:</label>
                    <span>₹ 450.00</span>
                </div>
                <h4>Items:</h4>
                <ul class="order-items-list">
                    <li>The Great Gatsby x 1</li>
                    <li>To Kill a Mockingbird x 1</li>
                </ul>
                <p class="order-total">Total: ₹ 450.00</p>
            </li>

            <li class="order-item">
                <h3>Order #67890</h3>
                <div class="order-details">
                    <label>Order Date:</label>
                    <span>March 25, 2025</span>
                    <label>Status:</label>
                    <span>Delivered</span>
                    <label>Total:</label>
                    <span>₹ 280.00</span>
                </div>
                <h4>Items:</h4>
                <ul class="order-items-list">
                    <li>Pride and Prejudice x 1</li>
                </ul>
                <p class="order-total">Total: ₹ 280.00</p>
            </li>

        </ul>
    </div>

</body>
